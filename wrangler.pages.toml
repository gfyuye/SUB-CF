# Cloudflare Pages 专用配置
# 部署前请确保项目根目录（或输出目录）包含 _worker.js 文件
# 使用方式：wrangler pages deploy . --config wrangler.pages.toml
# 或在使用 Git 集成时，确保 Cloudflare 识别此文件（通常需命名为 wrangler.toml，见下方说明）

name = "cfsub"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

# 非敏感环境变量（Workers 与 Pages 通用）
[vars]
SUBAPI = "SUBAPI.fxxk.dedyn.io"
SUBCONFIG = "https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/config/ACL4SSR_Online_MultiCountry.ini"
STRICT_SELF_NODES = "1"
SUB_HOST_ALLOW = "raw.githubusercontent.com,githubusercontent.com"

[placement]
region = "aws:ap-northeast-1" 
